# TODO(supply-chain, plan §9): pin these actions to full commit SHAs before 1.0
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
      - name: BIP39 vectors gate
        run: entropy-forge verify-vectors | tail -1 | grep -q "24/24"
